name: build

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 新しい Go の安定版を、コードの変更が無くても週次で確認する。
    # runn の記法定義が変わると、このテストが失敗する。取り込みと修正 PR は runn-follow.yml が行う。
    - cron: "17 0 * * 1"

permissions:
  contents: write
  actions: read

jobs:
  test:
    name: 最新安定版の Go でテスト
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v6

      - name: 最新安定版の Go を導入
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: テスト
        run: go test ./... -coverprofile=coverage.out

      - name: カバレッジのバッジを更新する
        uses: k1LoW/octocov-action@v1
