name: build

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Check the latest stable Go weekly, even when the code has not changed.
    # If runn's notation definition changes, this test fails. runn-follow.yml imports it and opens the fix PR.
    - cron: "17 0 * * 1"

permissions:
  contents: write
  actions: read

jobs:
  test:
    name: 最新安定版の Go でテスト
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v6

      - name: 最新安定版の Go を導入
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: テスト
        run: go test ./... -coverprofile=coverage.out

      - name: カバレッジのバッジを更新する
        uses: k1LoW/octocov-action@v1
