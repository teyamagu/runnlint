# Default rules for runnlint.
# Place .runnlint-runn.yaml at the project root to inherit and override this config.
# Set extends: none to skip inheritance.
version: 1

# language may be ja (default) or en. It selects the display language.
# Omitting language means Japanese.

# Indentation, duplicate keys, and other general YAML checks are delegated to yamllint.
yamllint:
  enabled: true
  bin: yamllint
  # What to do when yamllint is not installed. error fails solely because yamllint is missing.
  missing: warning
  # To use a custom yamllint config:
  # config: .yamllint.yaml

ignore: []

rules:
  # --- runn structure ---
  - id: duplicate-key
    uses: duplicate-key
    severity: error

  - id: unknown-key
    uses: unknown-key
    severity: error

  - id: book-shape
    uses: book-shape
    severity: error

  - id: require-steps
    uses: require-steps
    severity: error

  - id: label-format
    uses: label-format
    severity: error

  - id: runner-reserved
    uses: runner-reserved
    severity: error

  - id: runner-config
    uses: runner-config
    severity: error

  - id: runner-defined
    uses: runner-defined
    severity: error

  - id: step-shape
    uses: step-shape
    severity: error

  - id: http-request
    uses: http-request
    severity: error

  - id: grpc-request
    uses: grpc-request
    severity: error

  - id: db-request
    uses: db-request
    severity: error

  - id: exec-request
    uses: exec-request
    severity: error

  - id: ssh-request
    uses: ssh-request
    severity: error

  - id: cdp-request
    uses: cdp-request
    severity: error

  - id: agent-request
    uses: agent-request
    severity: error

  - id: include-request
    uses: include-request
    severity: error

  - id: include-path
    uses: include-path
    severity: warning

  - id: needs-path
    uses: needs-path
    severity: warning

  - id: local-path
    uses: local-path
    severity: warning

  # A runbook with if: included is not included from anywhere in the scanned scope.
  # Checked only when scanning a directory, and only for files under --include-root.
  - id: included-unreferenced
    uses: included-unreferenced
    severity: warning

  # --- expressions and references ---
  - id: expr-syntax
    uses: expr-syntax
    severity: error

  - id: expr-braces
    uses: expr-braces
    severity: warning

  # A # comment in test, if, until, or bind. runn strips it but warns that it is deprecated and asks for // instead.
  - id: expr-sharp-comment
    uses: expr-sharp-comment
    severity: info

  - id: step-ref
    uses: step-ref
    severity: error

  - id: var-ref
    uses: var-ref
    severity: warning
    # Variables passed via the includer's include.vars are counted automatically. List CLI-passed variables here to suppress the warning.
    # options:
    #   ignore:
    #     - token

  - id: loop-index
    uses: loop-index
    severity: warning

  - id: previous-step
    uses: previous-step
    severity: warning

  - id: defer-experimental
    uses: defer-experimental
    severity: info

  # --- leftovers ---
  # A runner in runners: or runner: that no step calls.
  - id: unused-runner
    uses: unused-runner
    severity: warning

  # A runbook that can run on its own has no step with only test. Tests attached to requests check one response; a step with only test names what the scenario verifies.
  # Runbooks with if: included are verified by their caller.
  - id: require-test-step
    uses: require-test-step
    severity: info

  # --- suppression comments ---
  # Among "# runnlint disable-line": an unknown rule, a comment that suppresses nothing,
  # a comment inside a multiline scalar, and a directive other than disable-line.
  - id: unused-suppression
    uses: unused-suppression
    severity: warning

  # --- rules written in YAML only ---
  # select is dot-separated. * is each value of a mapping, or each element of a sequence.
  # Whether steps is a list or a map, steps.* refers to each step.
  - id: require-desc
    severity: warning
    message: "runbook に desc がありません"
    check:
      select: desc
      exists: true

  - id: no-debug
    severity: warning
    message: "debug が有効です"
    check:
      select: debug
      not_equals: true

  - id: loop-until-with-test
    severity: warning
    message: "step {{ .key }} は loop.until と test を同時に持っています。test は毎周評価されるため、リトライが始まる前に失敗します"
    check:
      select: steps.*
      where:
        - path: loop.until
          exists: true
        - path: test
          exists: true
      forbid: true
