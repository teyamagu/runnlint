# 意図的に壊した runbook。runnlint が検出する例。
runners:
  exec: https://example.com
  req: htts://example.com
labels:
  - bad label
steps:
  login:
    req:
      login:
        post:
          headers:
            Authorization: token
    test: "{{ steps[0].res.status == 200 }}"
    loop:
      count: 3
      until: current.res.status == 200
  later:
    nope:
      query: SELECT 1
    test: steps.missing.res.status == 200
