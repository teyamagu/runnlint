# Example of one step that writes both loop.until and test.
desc: until and test
runners:
  req: https://example.com
steps:
  - req:
      /status:
        get:
          body: null
    loop:
      count: 3
      until: current.res.status == 200
    test: current.res.status == 200
  - test: steps[0].res.status == 200
