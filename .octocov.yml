# Write coverage, code-to-test ratio, and test-duration badges under docs/.
# On main, push those files. No thresholds are set.
coverage:
  paths:
    - coverage.out
  badge:
    path: docs/coverage.svg
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
  test:
    - "**/*_test.go"
  badge:
    path: docs/ratio.svg
testExecutionTime:
  # The steps entry must match the name of the go test step in .github/workflows/ci.yml.
  # If it does not match, the step cannot be inferred from coverage.out timestamps, and docs/time.svg is not created.
  steps:
    - テスト
  badge:
    path: docs/time.svg
push:
  if: is_default_branch
  message: "カバレッジのバッジを更新する [skip ci]"
