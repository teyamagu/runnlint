# カバレッジ、コードとテストの比率、テスト時間のバッジを docs/ に書く。
# main ではそのファイルを push する。閾値は置かない。
coverage:
  paths:
    - coverage.out
  badge:
    path: docs/coverage.svg
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
  test:
    - "**/*_test.go"
  badge:
    path: docs/ratio.svg
testExecutionTime:
  # steps の名前は .github/workflows/ci.yml の name: テスト と一致している必要があります。
  # 一致しないと、coverage.out の時刻からステップを推測して測れず、docs/time.svg が作られません。
  steps:
    - テスト
  badge:
    path: docs/time.svg
push:
  if: is_default_branch
  message: "カバレッジのバッジを更新する [skip ci]"
